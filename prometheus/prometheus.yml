# Prometheus 配置 - 擎天施组评分系统
# 文档: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s        # 默认抓取间隔
  evaluation_interval: 15s    # 规则评估间隔
  scrape_timeout: 10s         # 抓取超时

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 告警规则文件
rule_files:
  - "alerts/*.yml"

# 抓取目标配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 擎天施组评分系统（与应用同一隔离 Docker 网络）
  - job_name: "qingtian"
    static_configs:
      - targets: ["app:8000"]
        labels:
          app: "qingtian"
          env: "staging"
    metrics_path: "/metrics"
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/qingtian_api_key
