# 施工组织设计评标评分系统 CI/CD
name: CI

on:
  push:
    branches: [main, master, "clawdbot/*"]
  pull_request:
    branches: [main, master, "codex/qingtian-*"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "ruff==0.2.1"

      - name: Verify Ruff version
        run: |
          python - <<'PY'
          import subprocess

          actual = subprocess.check_output(
              ["ruff", "--version"],
              text=True,
          ).strip()

          expected = "ruff 0.2.1"

          if actual != expected:
              raise SystemExit(
                  f"RUFF_VERSION_MISMATCH: expected={expected}, actual={actual}"
              )

          print(actual)
          PY

      - name: Run ruff
        run: python -m ruff check app/ tests/ scripts/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh

      - name: Run batch processing test
        run: |
          python -m app.cli batch \
            -i sample_shigong.txt \
            -i sample_shigong_action_missing.txt \
            -o build/ci_batch_output --docx

          # 验证产物存在
          test -f build/ci_batch_output/_batch_summary.json
          test -f build/ci_batch_output/sample_shigong_report.json
          test -f build/ci_batch_output/sample_shigong_report.docx
          echo "✅ Batch processing test passed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            build/*.json
            build/*.docx
            build/ci_batch_output/
          retention-days: 7

  container:
    name: Container delivery
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build --tag qingtian-ci:${{ github.sha }} .

      - name: Start and verify container
        run: |
          docker volume create qingtian-ci-data
          docker volume create qingtian-ci-config
          docker run --detach --name qingtian-ci \
            --publish 127.0.0.1:18000:8000 \
            --env API_KEYS=ci-container-key-9c8e3a1d \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume qingtian-ci-data:/var/lib/qingtian \
            --volume qingtian-ci-config:/srv/qingtian/app/resources \
            qingtian-ci:${{ github.sha }}
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/health
          curl -fsS http://127.0.0.1:18000/ready
          docker exec qingtian-ci python scripts/container_healthcheck.py
          test "$(docker exec qingtian-ci id -u)" = "10001"

      - name: Container logs
        if: always()
        run: docker logs qingtian-ci || true

      - name: Remove container
        if: always()
        run: |
          docker rm --force qingtian-ci || true
          docker volume rm qingtian-ci-data qingtian-ci-config || true
