name: Release candidate

on:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/niyoufei/zhifei-bizsystem
  GRAFANA_IMAGE_NAME: ghcr.io/niyoufei/zhifei-bizsystem-grafana
  RELEASE_VERSION: 1.1.0-rc.4

jobs:
  lint:
    name: Release Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt "ruff==0.2.1"
      - run: python -m scripts.verify_release --tag "${GITHUB_REF_NAME}"
      - run: python -m ruff check app/ tests/ scripts/
      - run: git diff --check
      - name: Validate monitoring contracts
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            -v /dev/null:/run/secrets/qingtian_api_key:ro \
            prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            test rules /etc/prometheus/tests/qingtian.test.yml
          docker run --rm --entrypoint amtool \
            -v "$PWD/prometheus:/etc/alertmanager:ro" \
            prom/alertmanager@sha256:82eb974c2aca363117a5771746c271f35a7d3da688193251a51a2f3ec783f81d \
            check-config /etc/alertmanager/alertmanager.yml
          QINGTIAN_IMAGE=ghcr.io/example/qingtian@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          R8_GRAFANA_IMAGE=ghcr.io/example/grafana@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          QINGTIAN_API_KEYS_FILE=/dev/null \
          R8_GRAFANA_ADMIN_PASSWORD_FILE=/dev/null \
            docker compose -f compose.yaml -f docker-compose.monitoring.yml config --quiet

  test:
    name: Release Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: python -m scripts.verify_release --tag "${GITHUB_REF_NAME}"
      - run: python -m pytest tests/ -v --cov=app --cov-report=term-missing

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pip-audit==2.9.0"
      - run: pip-audit --requirement requirements-runtime.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked release contents
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.0 dir /repo \
            --no-banner --redact --verbose

  container-delivery:
    name: Release Container delivery
    runs-on: ubuntu-latest
    needs: [lint, test, dependency-audit, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build amd64 release image
        run: |
          docker build \
            --build-arg APP_VERSION="${RELEASE_VERSION}" \
            --tag "qingtian-release:${GITHUB_SHA}" .
      - name: Build hardened Grafana image
        run: |
          docker build \
            --file Dockerfile.grafana \
            --tag "qingtian-grafana-release:${GITHUB_SHA}" .
      - name: Exercise hardened runtime and persistence
        env:
          API_KEY: rc-container-key-6f3c28a1
        run: |
          docker volume create qingtian-release-data
          docker volume create qingtian-release-config
          docker run --detach --name qingtian-release \
            --publish 127.0.0.1:18000:8000 \
            --env API_KEYS="${API_KEY}" \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume qingtian-release-data:/var/lib/qingtian \
            --volume qingtian-release-config:/srv/qingtian/app/resources \
            "qingtian-release:${GITHUB_SHA}"

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18000/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/health
          curl -fsS http://127.0.0.1:18000/ready
          test "$(docker exec qingtian-release id -u)" = "10001"
          test "$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' \
            http://127.0.0.1:18000/api/v1/projects)" = "401"
          curl -fsS -H "X-API-Key: ${API_KEY}" \
            http://127.0.0.1:18000/api/v1/projects >/tmp/projects-before.json
          docker exec qingtian-release sh -c \
            "tesseract --list-langs 2>/dev/null | grep -qx chi_sim"
          docker exec -i qingtian-release python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("/var/lib/qingtian/qingtian.sqlite3")
          assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          PY

          curl -fsS -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"name":"R7 release persistence probe"}' \
            http://127.0.0.1:18000/api/v1/projects >/tmp/project-created.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/project-created.json").read_text())
          Path("/tmp/project-id.txt").write_text(payload["id"])
          PY

          docker restart qingtian-release
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18000/ready >/dev/null && break
            sleep 2
          done
          curl -fsS -H "X-API-Key: ${API_KEY}" \
            http://127.0.0.1:18000/api/v1/projects >/tmp/projects-after.json
          python - <<'PY'
          import json
          from pathlib import Path

          project_id = Path("/tmp/project-id.txt").read_text()
          projects = json.loads(Path("/tmp/projects-after.json").read_text())
          assert any(project["id"] == project_id for project in projects)
          PY
      - name: Scan application release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qingtian-release:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan Grafana release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qingtian-grafana-release:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan Prometheus image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan Alertmanager image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/alertmanager@sha256:82eb974c2aca363117a5771746c271f35a7d3da688193251a51a2f3ec783f81d
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Exercise isolated monitoring stack
        env:
          API_KEY: rc-monitor-key-921b86a4
          GRAFANA_PASSWORD: rc-grafana-password-02af41d8
        run: |
          secret_dir="${RUNNER_TEMP}/qingtian-r8-secrets"
          install -d -m 0700 "${secret_dir}"
          printf '%s\n' "${API_KEY}" >"${secret_dir}/qingtian-api-key"
          printf '%s\n' "${GRAFANA_PASSWORD}" >"${secret_dir}/grafana-admin-password"
          chmod 0644 "${secret_dir}/qingtian-api-key" "${secret_dir}/grafana-admin-password"

          QINGTIAN_IMAGE="qingtian-release:${GITHUB_SHA}" \
          R8_GRAFANA_IMAGE="qingtian-grafana-release:${GITHUB_SHA}" \
          QINGTIAN_API_KEYS_FILE="${secret_dir}/qingtian-api-key" \
          R8_GRAFANA_ADMIN_PASSWORD_FILE="${secret_dir}/grafana-admin-password" \
          QINGTIAN_PORT=18080 \
            docker compose --project-name qingtian-release-monitor \
              -f compose.yaml -f docker-compose.monitoring.yml up -d --no-build

          stack_ready=false
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ready >/dev/null \
              && curl -fsS http://127.0.0.1:19090/-/ready >/dev/null \
              && curl -fsS http://127.0.0.1:13000/api/health >/dev/null; then
              stack_ready=true
              break
            fi
            sleep 2
          done
          test "${stack_ready}" = true

          target_up=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19090/api/v1/targets \
              >/tmp/prometheus-targets.json \
              && python -c 'import json; from pathlib import Path; p=json.loads(Path("/tmp/prometheus-targets.json").read_text()); q=[x for x in p["data"]["activeTargets"] if x["labels"].get("job")=="qingtian"]; raise SystemExit(0 if len(q)==1 and q[0]["health"]=="up" else 1)'; then
              target_up=true
              break
            fi
            sleep 2
          done
          test "${target_up}" = true

          curl -fsS http://127.0.0.1:19090/api/v1/targets >/tmp/prometheus-targets.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/prometheus-targets.json").read_text())
          targets = payload["data"]["activeTargets"]
          qingtian = [item for item in targets if item["labels"].get("job") == "qingtian"]
          assert len(qingtian) == 1
          assert qingtian[0]["health"] == "up", qingtian[0]
          PY

          datasource_uid="$(curl -fsS -u "qingtian-admin:${GRAFANA_PASSWORD}" \
            http://127.0.0.1:13000/api/datasources/name/Prometheus \
            | python -c 'import json,sys; print(json.load(sys.stdin)["uid"])')"
          curl -fsS -u "qingtian-admin:${GRAFANA_PASSWORD}" \
            "http://127.0.0.1:13000/api/datasources/uid/${datasource_uid}/health" \
            >/tmp/grafana-datasource-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/grafana-datasource-health.json").read_text())
          assert payload["status"] == "OK", payload
          PY
      - name: Container logs
        if: always()
        run: docker logs qingtian-release || true
      - name: Remove container and volumes
        if: always()
        run: |
          QINGTIAN_IMAGE="qingtian-release:${GITHUB_SHA}" \
          R8_GRAFANA_IMAGE="qingtian-grafana-release:${GITHUB_SHA}" \
          QINGTIAN_API_KEYS_FILE=/dev/null \
          R8_GRAFANA_ADMIN_PASSWORD_FILE=/dev/null \
            docker compose --project-name qingtian-release-monitor \
              -f compose.yaml -f docker-compose.monitoring.yml down --volumes || true
          docker rm --force qingtian-release || true
          docker volume rm qingtian-release-data qingtian-release-config || true

  publish:
    name: Publish multi-architecture images
    runs-on: ubuntu-latest
    needs: [container-delivery]
    outputs:
      app_digest: ${{ steps.build_app.outputs.digest }}
      grafana_digest: ${{ steps.build_grafana.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable application image
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ env.RELEASE_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Build and push immutable Grafana image
        id: build_grafana
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.grafana
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GRAFANA_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ${{ env.GRAFANA_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - name: Attest application build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_app.outputs.digest }}
          push-to-registry: true
      - name: Attest Grafana build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.GRAFANA_IMAGE_NAME }}
          subject-digest: ${{ steps.build_grafana.outputs.digest }}
          push-to-registry: true
      - name: Generate application SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build_app.outputs.digest }}
          format: spdx-json
          output-file: application-release.spdx.json
          upload-artifact: false
      - name: Generate Grafana SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GRAFANA_IMAGE_NAME }}@${{ steps.build_grafana.outputs.digest }}
          format: spdx-json
          output-file: grafana-release.spdx.json
          upload-artifact: false
      - name: Attest application SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_app.outputs.digest }}
          sbom-path: application-release.spdx.json
          push-to-registry: true
      - name: Attest Grafana SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-name: ${{ env.GRAFANA_IMAGE_NAME }}
          subject-digest: ${{ steps.build_grafana.outputs.digest }}
          sbom-path: grafana-release.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: |
            application-release.spdx.json
            grafana-release.spdx.json
          if-no-files-found: error

  github-release:
    name: GitHub pre-release
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-sbom
      - name: Record immutable digest
        run: |
          printf '%s@%s\n' "${IMAGE_NAME}" "${{ needs.publish.outputs.app_digest }}" \
            > release-digest.txt
          printf '%s@%s\n' "${GRAFANA_IMAGE_NAME}" "${{ needs.publish.outputs.grafana_digest }}" \
            >> release-digest.txt
          cp docs/release-v1.1.0-rc.4.md release-notes.md
          printf "\n## Immutable images\n\n- \`%s@%s\`\n- \`%s@%s\`\n" \
            "${IMAGE_NAME}" "${{ needs.publish.outputs.app_digest }}" \
            "${GRAFANA_IMAGE_NAME}" "${{ needs.publish.outputs.grafana_digest }}" \
            >> release-notes.md
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --prerelease \
            --title "QingTian ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            application-release.spdx.json grafana-release.spdx.json release-digest.txt
