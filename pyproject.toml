[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=69",
  "wheel",
]

[project]
name = "zhifei-bizsystem"
description = "施工组织设计评标评分系统"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = [
  "version",
]
dependencies = [
  "fastapi==0.135",
  "numpy",
  "openpyxl",
  "pillow",
  "pydantic==2.11.9",
  "pymupdf",
  "pytesseract",
  "python-docx",
  "python-dotenv",
  "python-multipart==0.0.32",
  "PyYAML",
  "starlette==1.3.1",
  "typer",
  "uvicorn",
]
[project.optional-dependencies]
dev = [
  "black",
  "httpx==0.28.1",
  "pre-commit",
  "pygments==2.20",
  "pytest",
  "pytest-cov",
  "ruff==0.2.1",
  'tomli==2.4; python_version < "3.11"',
]
[project.scripts]
zhifei-score = "app.cli:app"

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
