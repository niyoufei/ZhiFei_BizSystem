# R8 本机隔离监控栈。
# 必须与 compose.yaml 组合使用，并通过 QINGTIAN_IMAGE 传入不可变 GHCR digest：
# COMPOSE_PROJECT_NAME=qingtian-r8 docker compose \
#   -f compose.yaml -f docker-compose.monitoring.yml up -d

services:
  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${R8_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    secrets:
      - source: qingtian_api_keys
        target: qingtian_api_key
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
      - alertmanager

  alertmanager:
    image: prom/alertmanager@sha256:82eb974c2aca363117a5771746c271f35a7d3da688193251a51a2f3ec783f81d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${R8_ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://127.0.0.1:${R8_ALERTMANAGER_PORT:-19093}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    image: ${R8_GRAFANA_IMAGE:?R8_GRAFANA_IMAGE must use the candidate immutable digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${R8_GRAFANA_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: qingtian-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

secrets:
  grafana_admin_password:
    file: ${R8_GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password.txt}
